services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: courselens
      POSTGRES_PASSWORD: courselens
      POSTGRES_DB: courselens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the temporary server that runs db/*.sql on first boot is socket-only
      test: ["CMD-SHELL", "pg_isready -U courselens -h 127.0.0.1"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
